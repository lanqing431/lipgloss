name: Table data full validation

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  build:
    uses: charmbracelet/meta/.github/workflows/build.yml@d1d3c82b047b5451e099b326dbfedc46670da27a # main snapshot

  lint:
    uses: charmbracelet/meta/.github/workflows/lint.yml@d1d3c82b047b5451e099b326dbfedc46670da27a # main snapshot
    with:
      golangci_path: .golangci.yml
      golangci_version: v2.9
      timeout: 10m

  coverage:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: "on"
    steps:
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ^1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Full race and atomic coverage
        run: go test -race -count=1 -covermode atomic -coverprofile=profile.cov ./...
      - name: Coverage summary
        run: go tool cover -func=profile.cov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-race-coverage
          path: profile.cov

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Build every example including Unix SSH
        run: |
          go -C examples list ./...
          go -C examples build -mod=readonly ./...
